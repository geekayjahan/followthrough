<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Owner sign in · Followthrough</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="brand" href="/"><b class="mark">f.</b>Followthrough</a>
      <div class="login-intro">
        <p class="small">Owner workspace</p>
        <h1>Pick up where <br />you left off.</h1>
        <p>
          The conversations, coffee and cash. <br />A clear view of what needs
          you next.
        </p>
      </div>
      <form id="login-form">
        <h2>Sign in</h2>
        <label for="password">Owner password</label
        ><input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        /><button type="submit">Open workspace</button>
        <p id="notice" role="status" aria-live="polite"></p>
        <p class="small">
          Use the shared owner password configured for this workspace.
        </p>
      </form>
      <footer>Your business, in view.</footer>
    </main>
  </body>
</html>
